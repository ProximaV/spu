; Cell Broadband Engine SPU hardware device profiles for IDA Pro

.default CBEA_SPU_PS3

.CBEA_SPU_PS3
; PlayStation 3 Cell Broadband Engine SPU (256 KB Local Store, LSLR = 0x3FFFF)
area CODE   LS_VECTOR 0x00000:0x00400  SPU Interrupt Vector & Reserved Local Store
area CODE   LS_MAIN   0x00400:0x40000  SPU Local Store (256 KB)

entry SPU_Interrupt_Vector 0x00000  SPU Interrupt Handler Entry Point (SPU ISA Sec. 12.1)

.CBEA_SPU_GENERIC
; Generic Cell Broadband Engine SPU (256 KB Local Store, LSLR = 0x3FFFF)
area CODE   LS_ALL    0x00000:0x40000  SPU Local Store (256 KB)
entry SPU_Interrupt_Vector 0x00000  SPU Interrupt Handler Entry Point
